name: Headless render probe

# Answers one question: can a GPU-less runner encode H.264 via WebCodecs?
# If it can, TripTrail's offline export works here and no live tab is needed.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node probe.mjs
